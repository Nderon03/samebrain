bc.forEach((y,i)=>{const x=ac[i];if(!x)return a.appendChild(y);

const cl=()=>{const o=$('#ov');o&&o.remove()},ov=h=>{const o=$('#ov'),k=(/^\s*<[^>]*\bdata-scr="?([\w-]+)/.exec(h)||[])[1]||'';if(o&&k&&o.dataset.k===k){const t=document.createElement('div');t.innerHTML=h;return morph(o,t)}cl();document.body.insertAdjacentHTML('beforeend',`<div id=ov data-k="${k}">${h}</div>`)};
function leave(){if(!st.on)return home();modal({icon:'🚪',title:'Leave game?',body:'Scores and progress for this game will be lost.',btns:[['Keep playing','g'],['Leave to home','r',home]]})}
function rules(first){if(first){S.seen=1;sv()}ov(`<div class=c style="justify-content:flex-start"><h2>How to play</h2><div class=card>📱 Pass &amp; Play on one phone, or host an online room where everyone uses their own phone. Everyone secretly picks an answer, then all are revealed together.<br>🎯 <b>Match the majority: 2 pts.</b> Everyone agrees: <b>+5 Perfect Sync</b>. Most points wins.</div><h3>Modes</h3><div class="card sm">🎯 <b>Classic</b>: divisive multiple choice. Think like the group. Special round every 4th.</div><div class="card sm">👀 <b>Most Likely</b>: vote for any player, yourself included, on who is most likely to… Match the majority.</div><div class="card sm">⚖️ <b>Split</b>: each round one player writes a prompt and two options and sits out. Everyone else votes. Majority = 2 pts. The writer earns 2 pts for every vote on the smaller side, so closer splits and bigger groups are worth more (a perfect split gets a special animation). Best with an odd number of players.</div><div class="card sm">🧑‍🤝‍🧑 <b>Know Me</b>: one player is the subject each round. Everyone else guesses what they picked.</div><div class="card sm">⏭️ <b>Skips</b>: the group has 2 question skips per game. ⚔️ <b>Ties</b> for first go to sudden death.</div><div class="card sm">🌶️ <b>Mature</b> (optional, 3 intensities): more mature, adult-themed prompts in Classic, Most Likely and Know Me. Split uses your own prompts, so it doesn't apply there.</div><div class="card sm">🔥 <b>Streaks</b>: match the majority 3 rounds in a row for +2 bonus.</div><div class="card sm">🎡 <b>Mystery Wheel</b>: once per player per game, spin before locking an answer for a bonus that only helps you.</div><h3>Special rounds</h3>${Object.keys(INFO).slice(1).map(k=>`<div class=sm><b>${INFO[k][0]}</b> <span class=m>${INFO[k][1]}</span></div>`).join('')}<button class="b y" onclick=cl()>${first?'Skip / Got it':'Got it'}</button></div>`)}
function seg(l,on,js){return`<button class="${on?'on':''}" onclick="${js};sv();setup()">${l}</button>`}
function setup(){SER=null;const M={classic:['Classic','Divisive multiple choice. Match the majority to score. Special round every 4th.'],likely:['Most Likely','Vote for any player, yourself included, on who is most likely to… Match the majority.'],split:['Split','Each round one player writes a prompt and two options, everyone else votes. Split the room evenly to score big!'],know:['Know Me','One player is the subject each round and answers honestly. Everyone else guesses their pick: 2 pts per correct guess, and the subject earns 1 pt per friend who reads them.']};
R(`<div class=c data-scr=setup style="justify-content:flex-start"><h2>Players (${S.names.length})</h2>${S.names.map((n,i)=>`<div class=row><input maxlength=14 value="${E(n)}" placeholder="Player ${i+1}" oninput="S.names[${i}]=this.value"><button class=i onclick="rnd(${i})">🎲</button>${S.names.length>3?`<button class=i onclick="rm(${i})">✕</button>`:''}</div>`).join('')}${S.names.length<12?'<button class="b g" onclick=add()>+ Add player</button>':''}<h3>Rounds</h3><div class=seg>${[5,10,15].map(n=>seg(n,S.rounds==n,`S.rounds=${n}`)).join('')}</div><h3>Mode</h3>${window.SBmodes?SBmodes():`<div class=seg>${Object.keys(M).map(k=>`<button type=button class="${S.mode==k?'on':''}" onclick="setMode('${k}');setup()">${M[k][0]}</button>`).join('')}</div>`}<p class="m sm">${M[S.mode][1]}${S.mode=='split'?` ${S.names.length%2?'✅ Odd player count: perfect splits are possible.':'⚠️ Best with an odd number of players: a perfect split needs an even number of voters.'}`:''}</p>${spUI('setup()')}${S.mode=='split'?'':matUI('setup()')}<button class="b y" onclick=go()>Start game</button><button class="b g" onclick=home()>Back</button></div>`)}
/* Mature: optional content preference (internally S.sx / S.lv, unchanged so saved settings carry over). Never shown for Split. */
const MLV=['Relatable habits and harmless hypocrisy.','Exes, jealousy, secret DMs and drama (includes Messy).','The most provocative and divisive (includes all levels).'];
function matUI(rr){return`<h3>Mature</h3><div class=seg><button type=button class="${S.sx?'':'on'}" onclick="S.sx=0;sv();${rr}">Off</button><button type=button class="${S.sx?'on':''}" onclick="${S.sx?'':`mature(()=>{${rr}})`}">On</button></div>${S.sx?`<h3>Intensity</h3><div class=seg>${LV.map((l,i)=>`<button type=button class="${S.lv==i?'on':''}" onclick="S.lv=${i};sv();${rr}">${l}</button>`).join('')}</div><p class="m sm">${MLV[S.lv]||''}</p>`:'<p class="m sm">Optional. Turn on for more mature, adult-themed prompts in Classic, Most Likely and Know Me.</p>'}`}
function mature(cb){modal({icon:'🌶️',title:'Turn on Mature?',body:'Mature mixes more adult-themed prompts into the built-in questions: relationships, exes, secrets and morally grey dilemmas.<p class=sm>You can switch it off at any time.</p>',btns:[['Cancel','g'],['Turn on','y',()=>{S.sx=1;sv();cb&&cb()}]]})}
function setMode(k){S.mode=k;if(k=='split')S.sx=0;sv()}
